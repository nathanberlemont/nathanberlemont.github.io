<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Développement — Berlemont Design</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --fg: #0a0a0a; --muted: #888; --border: #e8e8e8;
      --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 48px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; text-decoration: none; color: var(--fg); }
    .logo img { height: 48px; width: auto; display: block; }
    .logo span { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-left: 14px; }
    nav a { font-size: 13px; color: var(--muted); text-decoration: none; letter-spacing: 0.04em; margin-left: 32px; transition: color 0.2s; }
    nav a:hover { color: var(--fg); }

    .board-label {
      position: fixed; bottom: 32px; left: 48px; z-index: 200;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      pointer-events: none;
    }

    .strip-wrapper {
      position: fixed;
      top: 81px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
    }

    /* La bande est un conteneur flex horizontal sans gap (géré en JS) */
    #strip {
      display: flex;
      align-items: stretch;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      will-change: transform;
    }

    /* Chaque colonne est un empilement vertical */
    .col {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .col img {
      width: 100%;
      object-fit: contain;
      background: var(--bg);
      display: block;
      flex-shrink: 0;
      cursor: zoom-in;
      transition: opacity 0.3s;
    }
    .col img:hover { opacity: 0.88; }

    /* Lightbox */
    #lightbox {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.92); cursor: zoom-out;
      align-items: center; justify-content: center;
    }
    #lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; display: block; }

    @media (max-width: 768px) {
      header { padding: 12px 20px; }
      header .logo span { display: none; }
      nav a { margin-left: 16px; font-size: 12px; }
      .board-label { bottom: 16px; left: 20px; font-size: 10px; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="index.html">
      <img src="Sans titre - 2-01.png" alt="Berlemont Design">
      <span>Nathan Berlemont Design</span>
    </a>
    <nav>
      <a href="index.html#projets">Projets</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <div class="board-label">Développement — 39 planches</div>

  <div class="strip-wrapper" id="wrapper">
    <div id="strip"></div>
  </div>

  <div id="lightbox">
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    const srcs = [
      'dev-board-01/scan-01.jpg','dev-board-01/scan-02.jpg','dev-board-01/scan-03.jpg',
      'dev-board-01/scan-04.jpg','dev-board-01/scan-05.jpg','dev-board-01/scan-06.jpg',
      'dev-board-01/scan-07.jpg','dev-board-01/scan-08.jpg','dev-board-01/scan-09.jpg',
      'dev-board-01/scan-10.jpg','dev-board-01/scan-11.jpg','dev-board-01/scan-12.jpg',
      'dev-board-01/scan-13.jpg','dev-board-01/scan-14.jpg','dev-board-01/scan-15.jpg',
      'dev-board-01/scan-16.jpg','dev-board-01/scan-17.jpg','dev-board-01/scan-18.jpg',
      'dev-board-01/scan-19.jpg','dev-board-01/scan-20.jpg','dev-board-01/scan-21.jpg',
      'dev-board-01/scan-22.jpg','dev-board-01/scan-23.jpg','dev-board-01/scan-24.jpg',
      'dev-board-01/scan-25.jpg',
      'dev-board-02/scan-01.jpg','dev-board-02/scan-02.jpg','dev-board-02/scan-03.jpg',
      'dev-board-02/scan-04.jpg','dev-board-02/scan-05.jpg','dev-board-02/scan-06.jpg',
      'dev-board-02/scan-07.jpg','dev-board-02/scan-08.jpg','dev-board-02/scan-09.jpg',
      'dev-board-02/scan-10.jpg','dev-board-02/scan-11.jpg','dev-board-02/scan-12.jpg',
      'dev-board-02/scan-13.jpg','dev-board-02/scan-14.jpg',
    ];

    const strip   = document.getElementById('strip');
    const wrapper = document.getElementById('wrapper');
    const lb      = document.getElementById('lightbox');
    const lbImg   = document.getElementById('lightbox-img');

    const GAP        = 11;   // ≈ 3mm entre photos
    const SPEED      = 0.45; // px/frame
    const containerH = window.innerHeight - 81;

    // Largeurs de colonnes disponibles (variété visuelle)
    const COL_WIDTHS = [160, 190, 210, 230, 180, 200, 220, 175];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Calcule la disposition : colonnes avec hauteurs proportionnelles pour remplir l'écran
    function computeLayout(images) {
      const pool = shuffle(images);
      const cols = [];
      let i = 0;
      while (i < pool.length) {
        // 2 à 4 images par colonne
        const count = 2 + Math.floor(Math.random() * 3);
        const batch = pool.slice(i, Math.min(i + count, pool.length));
        i += batch.length;

        const colW = COL_WIDTHS[Math.floor(Math.random() * COL_WIDTHS.length)];

        // Poids aléatoires pour les hauteurs relatives
        const weights = batch.map(() => 0.5 + Math.random());
        const totalW  = weights.reduce((a, b) => a + b, 0);
        const totalGap = (batch.length - 1) * GAP;
        // Chaque image prend une part proportionnelle de la hauteur disponible
        const heights = weights.map(w => Math.round(w / totalW * (containerH - totalGap)));

        cols.push({ srcs: batch, colW, heights });
      }
      return cols;
    }

    // Rend un jeu de colonnes dans le strip
    function renderLayout(layout, openLb) {
      let setW = 0;
      layout.forEach(({ srcs: batchSrcs, colW, heights }) => {
        const col = document.createElement('div');
        col.className = 'col';
        col.style.width        = colW + 'px';
        col.style.gap          = GAP + 'px';
        col.style.marginRight  = GAP + 'px';
        col.style.height       = containerH + 'px';

        batchSrcs.forEach((src, j) => {
          const img = document.createElement('img');
          img.src = src;
          img.style.height = heights[j] + 'px';
          img.addEventListener('click', () => openLb(src));
          col.appendChild(img);
        });

        strip.appendChild(col);
        setW += colW + GAP;
      });
      return setW;
    }

    function openLightbox(src) {
      lbImg.src = src;
      lb.style.display = 'flex';
    }

    // Calcule et rend deux copies identiques pour la boucle
    const layout  = computeLayout(srcs);
    const setWidth = renderLayout(layout, openLightbox);
    renderLayout(layout, openLightbox);

    // Animation défilement droite → gauche
    let x = 0;
    let paused = false;

    function animate() {
      if (!paused) {
        x -= SPEED;
        if (Math.abs(x) >= setWidth) x = 0;
        strip.style.transform = `translateX(${x}px)`;
      }
      requestAnimationFrame(animate);
    }
    animate();

    wrapper.addEventListener('mouseenter', () => paused = true);
    wrapper.addEventListener('mouseleave', () => paused = false);

    window.addEventListener('resize', () => location.reload());

    // Lightbox
    lb.addEventListener('click', () => { lb.style.display = 'none'; lbImg.src = ''; });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { lb.style.display = 'none'; lbImg.src = ''; }
    });
  </script>

</body>
</html>
