<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Développement — Berlemont Design</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --fg: #0a0a0a; --muted: #888; --border: #e8e8e8;
      --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 48px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; text-decoration: none; color: var(--fg); }
    .logo img { height: 48px; width: auto; display: block; }
    .logo span { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-left: 14px; }
    nav a {
      font-size: 13px; color: var(--muted); text-decoration: none;
      letter-spacing: 0.04em; margin-left: 32px; transition: color 0.2s;
    }
    nav a:hover { color: var(--fg); }

    /* Section label bottom-left */
    .board-label {
      position: fixed; bottom: 32px; left: 48px; z-index: 200;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      pointer-events: none;
    }

    /* Board canvas */
    #board {
      position: fixed;
      inset: 0;
      top: 81px;
    }

    .card {
      position: absolute;
      cursor: zoom-in;
      transition: box-shadow 0.3s ease;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      will-change: transform;
    }

    @media (max-width: 768px) {
      header { padding: 12px 20px; }
      header .logo span { display: none; }
      nav a { margin-left: 16px; font-size: 12px; }
      .board-label { bottom: 16px; left: 20px; font-size: 10px; }
    }
    .card:hover {
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      z-index: 50 !important;
    }
    .card img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    /* Lightbox */
    #lightbox {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.92); cursor: zoom-out;
      align-items: center; justify-content: center;
    }
    #lightbox img {
      max-width: 90vw; max-height: 90vh; object-fit: contain; display: block;
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="index.html">
      <img src="Sans titre - 2-01.png" alt="Berlemont Design">
      <span>Nathan Berlemont Design</span>
    </a>
    <nav>
      <a href="index.html#projets">Projets</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <div class="board-label">Développement — 39 planches</div>

  <div id="board"></div>

  <div id="lightbox">
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    // Responsive config
    function isMobile() { return window.innerWidth <= 768; }
    function isTablet() { return window.innerWidth <= 1024 && window.innerWidth > 768; }

    const srcs = [
      'dev-board-01/scan-01.jpg','dev-board-01/scan-02.jpg','dev-board-01/scan-03.jpg',
      'dev-board-01/scan-04.jpg','dev-board-01/scan-05.jpg','dev-board-01/scan-06.jpg',
      'dev-board-01/scan-07.jpg','dev-board-01/scan-08.jpg','dev-board-01/scan-09.jpg',
      'dev-board-01/scan-10.jpg','dev-board-01/scan-11.jpg','dev-board-01/scan-12.jpg',
      'dev-board-01/scan-13.jpg','dev-board-01/scan-14.jpg','dev-board-01/scan-15.jpg',
      'dev-board-01/scan-16.jpg','dev-board-01/scan-17.jpg','dev-board-01/scan-18.jpg',
      'dev-board-01/scan-19.jpg','dev-board-01/scan-20.jpg','dev-board-01/scan-21.jpg',
      'dev-board-01/scan-22.jpg','dev-board-01/scan-23.jpg','dev-board-01/scan-24.jpg',
      'dev-board-01/scan-25.jpg',
      'dev-board-02/scan-01.jpg','dev-board-02/scan-02.jpg','dev-board-02/scan-03.jpg',
      'dev-board-02/scan-04.jpg','dev-board-02/scan-05.jpg','dev-board-02/scan-06.jpg',
      'dev-board-02/scan-07.jpg','dev-board-02/scan-08.jpg','dev-board-02/scan-09.jpg',
      'dev-board-02/scan-10.jpg','dev-board-02/scan-11.jpg','dev-board-02/scan-12.jpg',
      'dev-board-02/scan-13.jpg','dev-board-02/scan-14.jpg',
    ];

    const board = document.getElementById('board');
    const lb    = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');

    const W = () => window.innerWidth;
    const H = () => window.innerHeight - 81;

    // Responsive sizes and columns
    const sizePool = isMobile() ? [110, 135, 160, 185]
                   : isTablet() ? [170, 210, 250, 290]
                   : [220, 260, 300, 340, 380];
    const cols = isMobile() ? 2 : isTablet() ? 3 : 4;
    const colW = () => W() / cols;

    const items = srcs.map((src, i) => {
      const w = sizePool[Math.floor(Math.random() * sizePool.length)];
      const col = i % cols;
      const x = col * colW() + (Math.random() - 0.3) * colW() * 0.9;
      const y = (i / srcs.length) * (H() * 2.8) - H();

      // All drift downward, slightly different speeds
      const vy = 0.25 + Math.random() * 0.25;

      const card = document.createElement('div');
      card.className = 'card';
      card.style.width  = w + 'px';
      card.style.left   = Math.max(0, Math.min(x, W() - w)) + 'px';
      card.style.top    = y + 'px';
      card.style.zIndex = Math.floor(Math.random() * 8) + 1;

      const img = document.createElement('img');
      img.src = src;
      img.draggable = false;
      card.appendChild(img);
      board.appendChild(card);

      card.addEventListener('click', () => {
        lbImg.src = src;
        lb.style.display = 'flex';
      });

      return { card, x: Math.max(0, Math.min(x, W() - w)), y, vy, w };
    });

    function animate() {
      const cH = H();
      items.forEach(item => {
        item.y += item.vy;
        const h = item.card.offsetHeight || 300;
        // When card exits bottom, loop back to above the top
        if (item.y > cH + 20) {
          item.y = -(h + 40 + Math.random() * 200);
        }
        item.card.style.top = item.y + 'px';
      });
      requestAnimationFrame(animate);
    }
    animate();

    // Lightbox close
    lb.addEventListener('click', () => { lb.style.display = 'none'; lbImg.src = ''; });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { lb.style.display = 'none'; lbImg.src = ''; }
    });
  </script>

</body>
</html>
